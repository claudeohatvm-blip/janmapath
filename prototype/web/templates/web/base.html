<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}JanmaPath{% endblock %}</title>
<style>
  :root{
    --bg:#05060a; --panel:#0b1020; --panel-2:#0e1428; --line:#1c2740;
    --ink:#e8ecf8; --muted:#8792ad; --dim:#5d6885;
    --blue:#3b82f6; --blue-glow:#60a5fa; --red:#ff3b5c; --gold:#f5c451;
    --ok:#34d399;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:
      radial-gradient(1100px 600px at 20% -10%, #0d1a3a 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #230d1c 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:40px 20px 72px}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .mark{
    width:30px;height:30px;border-radius:50%;flex:none;
    background:conic-gradient(from 210deg,var(--blue),var(--red),var(--gold),var(--blue));
    box-shadow:0 0 22px rgba(59,130,246,.45);
  }
  .brand h1{font-size:20px;margin:0;letter-spacing:.34em;text-transform:uppercase;font-weight:600}
  .tagline{color:var(--muted);font-size:13px;margin:0 0 30px 41px;letter-spacing:.04em}
  .card{
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--line); border-radius:14px; padding:26px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  h2{font-size:15px;margin:0 0 20px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-glow);font-weight:600}
  h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px;font-weight:600}
  label{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  input,select{
    width:100%;padding:11px 13px;background:#070b16;color:var(--ink);
    border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;
  }
  input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
  .grid{display:grid;gap:18px;grid-template-columns:repeat(2,1fr)}
  .grid .full{grid-column:1/-1}
  .radios{display:flex;gap:9px;flex-wrap:wrap}
  .radios label{
    flex:1;min-width:132px;display:flex;align-items:center;gap:9px;margin:0;
    padding:11px 13px;border:1px solid var(--line);border-radius:9px;cursor:pointer;
    text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink);background:#070b16;
  }
  .radios label:has(input:checked){border-color:var(--blue);background:rgba(59,130,246,.11)}
  .radios input{width:auto;margin:0;accent-color:var(--blue)}
  button{
    width:100%;margin-top:26px;padding:14px;border:0;border-radius:10px;cursor:pointer;
    background:linear-gradient(90deg,var(--blue),#7c5cf0);color:#fff;
    font:inherit;font-size:14px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
    box-shadow:0 8px 26px rgba(59,130,246,.32);
  }
  button:hover{filter:brightness(1.12)}
  .err{
    background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.42);
    color:#ffbecb;padding:12px 14px;border-radius:9px;margin-bottom:20px;font-size:13.5px;
  }
  .note{color:var(--dim);font-size:12.5px;margin-top:9px;line-height:1.55}
  a{color:var(--blue-glow)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{
    text-align:left;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600;
  }
  td{padding:9px 10px;border-bottom:1px solid rgba(28,39,64,.5)}
  tbody tr:hover{background:rgba(59,130,246,.05)}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.05em}
  .tag-ex{background:rgba(52,211,153,.14);color:#6ee7b7}
  .tag-de{background:rgba(255,59,92,.14);color:#ff9bad}
  .tag-own{background:rgba(59,130,246,.15);color:var(--blue-glow)}
  .tag-r{background:rgba(245,196,81,.14);color:var(--gold)}
  @media(max-width:680px){.grid{grid-template-columns:1fr}.wrap{padding:26px 15px 50px}}
  {% block style %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark"></div><h1>JanmaPath</h1></div>
  <p class="tagline">{% block tagline %}India&rsquo;s first personalized astrology companion{% endblock %}</p>
  {% block body %}{% endblock %}
</div>
{% block script %}{% endblock %}
</body>
</html>
